; PlatformIO project for ESP32 DevKit V1
; Edge control remains local; cloud telemetry is best-effort.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
  beegee-tokyo/DHTesp@^1.18
build_flags =
  -DCORE_DEBUG_LEVEL=1
